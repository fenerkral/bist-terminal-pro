version: '3.8'

services:
  backend:
    build: ./backend
    command: python main.py
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./bist_terminal.db
      DEBUG: "True"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bist
      POSTGRES_PASSWORD: bist123
      POSTGRES_DB: bist_terminal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
